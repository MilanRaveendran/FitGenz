<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | FitGenz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", sans-serif;
}

/* PREMIUM BACKGROUND */
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
    linear-gradient(rgba(255,255,255,0.65), rgba(255,255,255,0.65)),
    url("bgimages.png.png");

    background-size:cover;
    background-position:center;
}

/* GLASS CARD */
.container{
    width:100%;
    max-width:420px;
    padding:45px 35px;
    text-align:center;

    background:rgba(255,255,255,0.65);
    backdrop-filter:blur(12px);

    border-radius:20px;
    border:1px solid rgba(255,255,255,0.8);

    box-shadow:0 15px 40px rgba(0,0,0,0.12);
}

/* TITLE */
h2{
    color:#159895;
    font-size:30px;
    margin-bottom:20px;
}

/* INPUT */
input{
    width:100%;
    padding:13px;
    margin-top:12px;
    border-radius:10px;
    border:1px solid #e5e7eb;
    font-size:15px;
}

/* BUTTON */
button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:600;
    color:white;

    background:linear-gradient(135deg,#34d399,#0ea5a4);
    box-shadow:0 12px 30px rgba(0,0,0,0.18);
    cursor:pointer;
}

/* LINKS */
a{
    color:#159895;
    text-decoration:none;
}

.note{
    margin-top:15px;
    font-size:13px;
    color:#6b7280;
}

/* MOBILE TWEAK */
@media(max-width:480px){
    .container{
        padding:35px 22px;
    }

    h2{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="container">
<h2>Welcome Back</h2>

<input type="email" id="email" placeholder="Email address">
<input type="password" id="password" placeholder="Password">

<p style="text-align:right; margin-top:10px; font-size:14px;">
<a href="#" onclick="resetPassword()">Forgot Password?</a>
</p>

<button onclick="Signin()">Sign in</button>

<p style="margin-top:15px;">
New user?
<a href="signup.html">Create Account</a>
</p>
</div>

<script>
async function Signin() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please fill both fields.");
        return;
    }

    try {
        const res = await fetch("http://localhost:5000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        console.log("Login response:", data);  // 👈 DEBUG

        if (res.ok) {

            localStorage.setItem("userId", data.userId);
            console.log("Saved userId:", localStorage.getItem("userId")); // 👈 DEBUG

            window.location.href = "record.html";

        } else {
            alert(data.error || "Login failed");
        }

    } catch (err) {
        console.error("Login error:", err);
        alert("Login failed.");
    }
}
</script>


</body>
</html>
